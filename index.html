<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Task Manager</h1>

<p id="student-id">73549</p>

<form id="task-form">
    <input
            type="text"
            id="task-title"
            placeholder="Task title"
            required>

    <input
            type="text"
            id="task-description"
            placeholder="Task description">

    <button type="submit" id="task-submit">
        Save Task
    </button>
</form>

<p id="status-message"></p>

<div id="task-list"></div>

<a id="contribution-link" href="contribution.html">
    Contribution Page
</a>

<script src="app.js"></script>

</body>
</html>
