<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Team Contribution</h1>
    <button type="button" id="load-contributor">Show Contributor</button>
    <p id="contributor-student-id"></p>
    <p><a href="index.html">Back to Task Manager</a></p>
  </main>

  <script>
    document.getElementById('load-contributor').addEventListener('click', async () => {
      const output = document.getElementById('contributor-student-id');
      try {
        const res = await fetch('contribution.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        output.textContent = `Contributor Student ID: ${data.contributorStudentId}`;
      } catch (err) {
        output.textContent = `Could not load contribution.json (${err.message})`;
      }
    });
  </script>
</body>
</html>
